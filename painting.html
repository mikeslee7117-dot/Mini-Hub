<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painting — Mini Tracker</title>
  <link rel="stylesheet" href="styles.css?v=20260331" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="index.html" class="site-brand" aria-label="Mini Hub dashboard">
        <span class="site-brand-title">Mini Hub</span>
      </a>

      <details class="sidebar-menu">
        <summary class="menu-toggle">Menu</summary>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="index.html" class="nav-link">Dashboard</a>
          <a href="tracker.html" class="nav-link">Tracker</a>
          <a href="armies.html" class="nav-link">Armies</a>
          <a href="scenarios.html" class="nav-link">Scenarios</a>
          <a href="painting.html" class="nav-link nav-link--active">Painting</a>
        </nav>
      </details>
    </aside>

    <main class="app">
      <section class="page-banner painting-banner dashboard-hero" aria-label="Painting banner">
        <div class="page-banner-content">
          <h1>Painting</h1>
          <p>Track your paint inventory and paints used per unit.</p>
        </div>
      </section>

      <section class="panel">
        <div class="section-toolbar">
          <h2>Paint Inventory</h2>
          <button id="open-add-paint-btn" type="button">Add Paint</button>
        </div>
        <form id="paint-filters-form" class="filters paint-filters">
          <label>Search<input id="paint-filter-search" name="paintSearch" placeholder="Name, type, or brand" autocomplete="off" /></label>
          <label>Type<select id="paint-filter-type"><option value="all">All Types</option></select></label>
          <label>Brand<select id="paint-filter-brand"><option value="all">All Brands</option></select></label>
          <button type="button" id="paint-filter-clear">Clear</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="paints-body"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="section-toolbar">
          <h2>Unit Paint Assignments</h2>
          <button id="open-add-unit-btn" type="button">Add Unit</button>
        </div>
        <p class="small-note">Add a unit, then use Edit to assign paints and areas.</p>
        <div id="paint-plans"></div>
      </section>
    </main>
  </div>

  <!-- Add Paint Dialog -->
  <dialog id="add-paint-dialog">
    <div class="dialog-header">
      <h2>Add Paint</h2>
      <button class="dialog-close-btn" type="button" data-close-dialog="add-paint-dialog" aria-label="Close">&times;</button>
    </div>
    <form id="paint-form" class="dialog-form">
      <label>Name<input id="paint-name" name="name" required placeholder="e.g. Abaddon Black" /></label>
      <label>Type<input id="paint-type" name="type" required placeholder="e.g. Base" /></label>
      <label>Brand<input id="paint-brand" name="brand" required placeholder="e.g. Citadel" /></label>
      <div class="dialog-footer">
        <button type="button" data-close-dialog="add-paint-dialog" class="btn-secondary">Cancel</button>
        <button type="submit">Add Paint</button>
      </div>
    </form>
  </dialog>

  <!-- Add Unit to Paint Plan Dialog -->
  <dialog id="add-unit-dialog">
    <div class="dialog-header">
      <h2>Add Unit</h2>
      <button class="dialog-close-btn" type="button" data-close-dialog="add-unit-dialog" aria-label="Close">&times;</button>
    </div>
    <form id="paint-unit-form" class="dialog-form">
      <label>Unit
        <select id="paint-unit-select" name="entryId" required>
          <option value="">Select a unit</option>
        </select>
      </label>
      <div class="dialog-footer">
        <button type="button" data-close-dialog="add-unit-dialog" class="btn-secondary">Cancel</button>
        <button type="submit">Add Unit</button>
      </div>
    </form>
  </dialog>

  <!-- Edit Paint Dialog -->
  <dialog id="edit-paint-dialog">
    <div class="dialog-header">
      <h2>Edit Paint</h2>
      <button class="dialog-close-btn" type="button" data-close-dialog="edit-paint-dialog" aria-label="Close">&times;</button>
    </div>
    <form id="edit-paint-form" class="dialog-form">
      <label>Name<input id="edit-paint-dialog-name" name="name" required /></label>
      <label>Type<input id="edit-paint-dialog-type" name="type" required /></label>
      <label>Brand<input id="edit-paint-dialog-brand" name="brand" required /></label>
      <div class="dialog-footer">
        <button type="button" data-close-dialog="edit-paint-dialog" class="btn-secondary">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Edit Unit Paint Plan Dialog -->
  <dialog id="edit-plan-dialog">
    <div class="dialog-header">
      <h2 id="edit-plan-dialog-title">Edit Unit Paints</h2>
      <button class="dialog-close-btn" type="button" data-close-dialog="edit-plan-dialog" aria-label="Close">&times;</button>
    </div>
    <div class="dialog-body" id="edit-plan-dialog-body"></div>
    <div class="dialog-footer-wrap">
      <button type="button" data-close-dialog="edit-plan-dialog" class="btn-secondary">Done</button>
    </div>
  </dialog>

  <script src="cloud-sync.js"></script>
  <script src="ui.js"></script>
  <script src="painting.js"></script>
</body>
</html>

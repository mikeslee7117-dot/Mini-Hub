<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Tracker</title>
  <link rel="stylesheet" href="styles.css?v=20260331" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="index.html" class="site-brand" aria-label="Mini Hub dashboard">
        <span class="site-brand-title">Mini Hub</span>
      </a>

      <details class="sidebar-menu">
        <summary class="menu-toggle">Menu</summary>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="index.html" class="nav-link">Dashboard</a>
          <a href="tracker.html" class="nav-link nav-link--active">Tracker</a>
          <a href="armies.html" class="nav-link">Armies</a>
          <a href="scenarios.html" class="nav-link">Scenarios</a>
          <a href="painting.html" class="nav-link">Painting</a>
        </nav>
      </details>
    </aside>

    <main class="app">
      <section class="tracker-banner dashboard-hero" aria-label="Unit Tracker banner">
        <div class="tracker-banner-content">
          <h1>Mini Inventory & Paint Tracker</h1>
          <p>Track your backlog and painting progress by unit.</p>
        </div>
      </section>

      <section class="panel">
        <div class="section-toolbar">
          <h2>Current Inventory</h2>
          <button id="open-add-entry-btn" type="button">Add Entry</button>
        </div>
        <div class="summary" id="summary">
          <article class="stat-card">
            <p class="stat-label">Unit Entries</p>
            <p class="stat-value" id="stat-units">0</p>
          </article>
          <article class="stat-card">
            <p class="stat-label">Total Minis</p>
            <p class="stat-value" id="stat-total">0</p>
          </article>
          <article class="stat-card">
            <p class="stat-label">Completed Minis</p>
            <p class="stat-value" id="stat-completed">0</p>
          </article>
          <article class="stat-card">
            <p class="stat-label">Completion</p>
            <p class="stat-value" id="stat-percent">0%</p>
          </article>
        </div>

        <form id="filters-form" class="filters tracker-filters">
          <label>
            Game
            <select id="filter-game" name="game">
              <option value="All">All</option>
            </select>
          </label>
          <label>
            Faction
            <select id="filter-faction" name="faction">
              <option value="All">All</option>
            </select>
          </label>
          <label>
            Unit
            <select id="filter-unit" name="unit">
              <option value="All">All</option>
            </select>
          </label>
          <label>
            Status
            <select id="filter-status" name="status">
              <option value="All">All</option>
              <option value="Unpainted">Unpainted</option>
              <option value="Primed">Primed</option>
              <option value="Painted">Painted</option>
              <option value="Based">Based</option>
              <option value="Completed">Completed</option>
            </select>
          </label>
          <button type="button" id="clear-filters">Clear Filters</button>
        </form>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>
                  <button class="sort-btn" type="button" data-sort="unit">
                    <span>Unit</span>
                    <span class="sort-indicator" aria-hidden="true"></span>
                  </button>
                </th>
                <th>
                  <button class="sort-btn" type="button" data-sort="status">
                    <span>Status</span>
                    <span class="sort-indicator" aria-hidden="true"></span>
                  </button>
                </th>
                <th>Armies / Scenarios</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="entries-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <dialog id="add-entry-dialog">
    <div class="dialog-header">
      <h2>Add Entry</h2>
      <button class="dialog-close-btn" type="button" data-close-dialog="add-entry-dialog" aria-label="Close">&times;</button>
    </div>
    <form id="entry-form" class="dialog-form grid-form">
      <label>
        Game
        <input id="game" name="game" required />
      </label>
      <label>
        Faction
        <input id="faction" name="faction" required />
      </label>
      <label>
        Unit
        <input id="unit" name="unit" required />
      </label>
      <label>
        Number
        <input id="number" name="number" type="number" min="1" required />
      </label>
      <label>
        Type
        <input id="type" name="type" required />
      </label>
      <label>
        Status
        <select id="status" name="status" required>
          <option>Unpainted</option>
          <option>Primed</option>
          <option>Painted</option>
          <option>Based</option>
          <option>Completed</option>
        </select>
      </label>
      <div class="dialog-footer">
        <button type="button" data-close-dialog="add-entry-dialog" class="btn-secondary">Cancel</button>
        <button type="submit">Add Entry</button>
      </div>
    </form>
  </dialog>

  <dialog id="edit-entry-dialog">
    <div class="dialog-header">
      <h2>Edit Entry</h2>
      <button class="dialog-close-btn" type="button" data-close-dialog="edit-entry-dialog" aria-label="Close">&times;</button>
    </div>
    <form id="edit-entry-form" class="dialog-form grid-form">
      <label>
        Game
        <input id="dialog-edit-game" required />
      </label>
      <label>
        Faction
        <input id="dialog-edit-faction" required />
      </label>
      <label>
        Unit
        <input id="dialog-edit-unit" required />
      </label>
      <label>
        Number
        <input id="dialog-edit-number" type="number" min="1" required />
      </label>
      <label>
        Type
        <input id="dialog-edit-type" required />
      </label>
      <label>
        Status
        <select id="dialog-edit-status" required>
          <option>Unpainted</option>
          <option>Primed</option>
          <option>Painted</option>
          <option>Based</option>
          <option>Completed</option>
        </select>
      </label>
      <div class="dialog-footer">
        <button type="button" data-close-dialog="edit-entry-dialog" class="btn-secondary">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="cloud-sync.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
